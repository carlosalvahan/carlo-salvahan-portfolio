<div class="full-screen-container">
    <div class="header-container">
        <h3>Skills and Expertise</h3>
    </div>
    <div class="skill-container">
        @for (skill of skillSet; track $index) {
            <i [ngClass]="skill.icon" [ngStyle]="{'color': skill.color}"></i>
        }
    </div>
</div>
