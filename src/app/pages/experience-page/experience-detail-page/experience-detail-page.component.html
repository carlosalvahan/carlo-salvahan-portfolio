<div class="full-screen-container" [ngClass]="{'closing': isClosing}">
    <div class="header-container" [ngStyle]="{'background-color': detailItem()?.barColor}">
        <i class="fa-solid fa-xmark" (click)="onDownClick()"></i>
        <h3>{{ detailItem()?.title }}</h3>
    </div>
    <div class="details-content">
        <div class="detail-container">
            @for (company of companies; track $index) {
            <div class="card horizontal" [ngStyle]="{'border-color': detailItem()?.barColor}">
                <div class="card-image">
                    <img class="card-image-src" [src]="company[1].imageUrl" alt="Kaneko">
                </div>
                <div class="card-stacked">
                    <div class="card-action">
                        <p class="company-header" [ngStyle]="{'border-color': detailItem()?.barColor}">{{company[0]}} ({{ company[1].duration }})</p>
                    </div>
                    <div class="card-content">
                        {{ company[1].description }}
                    </div>
                </div>
            </div>
            }
            <div class="detail-skills" [ngStyle]="{'border-color': detailItem()?.barColor}">
                <h3 [ngStyle]="{'background-color': detailItem()?.barColor}">Key Skills</h3>
                <div class="skill-list">
                    @for (skill of skills; track $index) {
                    <div class="skill-group">
                        <div class="skill-item">
                        <i [ngClass]="skill.icon" [ngStyle]="{'color': skill.color}"></i>
                        </div>
                        <div class="skill-name">
                            {{ skill.name }}
                        </div>
                    </div>
                    }
                </div>
            </div>
        </div>
    </div>
    
</div>
