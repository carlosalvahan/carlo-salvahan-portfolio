<div class="full-screen-container" [ngClass]="{'closing': isClosing}">
    <div class="details-content">
        <div class="detail-container">
            @for (company of companies; track $index) {
            <div class="card horizontal" [ngStyle]="{'border-color': 'white', 'animation-delay': 0.1 * $index + 's'}">
                <div class="card-image">
                    <img class="card-image-src" [src]="company[1].imageUrl" alt="Kaneko" [ngStyle]="{'animation-delay': 1 * $index + 's'}">
                </div>
                <div class="card-stacked">
                    <div class="card-action">
                        <p class="company-header" [ngStyle]="{'border-color': 'white', 'animation-delay':  1 *  $index + 's'}">{{company[0]}} ({{ company[1].duration }})</p>
                    </div>
                    <div class="card-content" [ngStyle]="{ 'animation-delay':  1 *   $index + 's'}">
                        {{ company[1].description }}
                    </div>
                </div>
            </div>
            }
            <div class="detail-skills" [ngStyle]="{'border-color': 'white'}">
                <div class="skill-list">
                    @for (skill of skills; track $index) {
                    <div class="skill-group" [ngStyle]="{'animation-delay': (($index * 0.2) + companies.length) + 's'}">
                        <div class="skill-item">
                        <i [ngClass]="skill.icon" [ngStyle]="{'color': skill.color}"></i>
                        </div>
                        <div class="skill-name">
                            {{ skill.name }}
                        </div>
                    </div>
                    }
                </div>
            </div>
        </div>
    </div>
    
</div>
