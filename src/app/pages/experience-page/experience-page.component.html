<div class="super-container">
    <div class="experience-page-container">
        <div class="page-header">
            <h3>EXPERIENCE TIMELINE <i class="fa-solid fa-clock"></i></h3>
        </div>
        <div class="page-content">
            <app-timeline [timelineItems]="experienceItems" (viewDetailsClick)="onViewDetails($event)"></app-timeline>
        </div>
    </div>
</div>

@if(detailSelected) {
    <app-modal (closeClick)="onBackClick()" [modalTitle]="detailSelected.title">
        <app-experience-detail-page [detailItem]="detailSelected" (backClick)="onBackClick()"></app-experience-detail-page>
    </app-modal>
}
