<nav class="custom-nav-container">
    <ul>
        @for (item of navBarItems(); track item.navText) {
        <li [ngClass]="{ 'active': item.isActive }" >
            <a [href]="item.link" [ngClass]="item.textClass">
                <i [ngClass]="item.icon" class="icon-spacing"></i>{{ item.navText }}
            </a>
        </li>
        }
    </ul>
</nav>
