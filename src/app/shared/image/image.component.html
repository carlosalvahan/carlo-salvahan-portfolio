<div class="row center-align image-row">
    <div class="col l12 center">
        <img [src]="imageSrc()" alt="" class="circle responsive-img">
    </div>
    @if (imageText() || imageSubText()) {
    <div class="col l12">
        <h3 class="white-text">{{imageText()}}</h3>
        <h5 class="grey-text lighten-5">{{imageSubText()}}</h5>
    </div>
    }
</div>
