<div class="timeline-container">
    @for (item of localTimelineItems(); track $index) {
    <div class="timeline-item" (click)="onTimelineSelected(item)" [ngClass]="{selected: item.selected}">{{item.title}}</div>
    @if($index < timelineItems().length - 1) { 
        <i class="fa-solid fa-minus" style="color: white;"></i>
        }
    }
</div>
